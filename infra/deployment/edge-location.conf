    # Agent Department: isolated container, same HTTPS entrypoint.
    location = /agent-department { return 301 /agent-department/; }
    location ^~ /agent-department/ {
      # Resolve the container again after restarts; Podman's network DNS.
      resolver 10.89.0.1 valid=30s ipv6=off;
      set $agent_department_upstream agent-department-web:8080;
      rewrite ^/agent-department/(.*)$ /$1 break;
      proxy_pass http://$agent_department_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
    }
