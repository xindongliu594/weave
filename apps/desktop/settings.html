<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'"><title>连接与本机执行设置</title><link rel="stylesheet" href="settings.css"></head><body><main><small>AGENT DEPARTMENT</small><h1>连接你的团队</h1><p>桌面端与网页版使用同一个工作空间，部门、知识和执行记录保持一致。</p><form><label>服务器地址<input id="server" type="url" required></label><label>用户名<input id="username" autocomplete="username"></label><label>密码<input id="password" type="password" autocomplete="current-password" placeholder="已保存时可留空"></label><label class="check"><input id="remember" type="checkbox" checked>使用系统加密存储记住密码</label><p id="error" role="alert"></p><button id="connect">连接工作空间</button></form><p class="hint">连接失败时，请检查服务器地址、登录信息以及 Mac 后端是否在线。可从“工作空间”菜单重新连接。</p><section class="local-panel"><h2>本机执行</h2><p>选择一个目录作为运行工作区的父目录。每次获批准的运行会建立独立子目录，文件与命令结果回传工作空间验收。</p><label>设备名称<input id="device-name" maxlength="100"></label><p id="local-root">尚未选择目录</p><button id="choose-root" type="button">选择本机目录</button><label class="check"><input id="allow-commands" type="checkbox">允许工作台逐次批准的本机命令</label><p class="hint">本机命令以当前用户权限运行，可访问工作区之外的文件、网络与应用。仅文件模式的读写限制在独立运行工作区，拒绝链接和越界路径。</p><p id="local-status"></p><p id="local-error" role="alert"></p><div class="button-row"><button id="enable-local" type="button">启用本机执行</button><button id="disable-local" type="button">停用本机执行</button></div></section></main><script src="settings.js"></script></body></html>
