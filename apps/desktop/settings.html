<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'"><title>连接工作空间</title><link rel="stylesheet" href="settings.css"></head><body><main><small>AGENT DEPARTMENT</small><h1>连接你的团队</h1><p>桌面端与网页版使用同一个工作空间，部门、知识和执行记录保持一致。</p><form><label>服务器地址<input id="server" type="url" required></label><label>用户名<input id="username" autocomplete="username"></label><label>密码<input id="password" type="password" autocomplete="current-password" placeholder="已保存时可留空"></label><label class="check"><input id="remember" type="checkbox" checked>使用系统加密存储记住密码</label><p id="error" role="alert"></p><button>连接工作空间</button></form><p class="hint">连接失败时，请检查服务器地址、登录信息以及 Mac 后端是否在线。可从“工作空间”菜单重新连接。</p></main><script src="settings.js"></script></body></html>
