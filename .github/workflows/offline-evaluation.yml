name: Offline engineering evaluation

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-evaluation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: Synthetic evidence gate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: tools/evaluations/package-lock.json
      - name: Install locked evaluator without lifecycle scripts
        run: npm ci --prefix tools/evaluations --ignore-scripts --no-audit --no-fund
      - name: Require the real pinned CLI and supported runtime
        run: >-
          node --input-type=module -e
          "import {createRequire} from 'node:module';
          import {assertRuntime} from './tools/evaluations/run.mjs';
          const require=createRequire(import.meta.url);
          assertRuntime();
          if(require('./tools/evaluations/node_modules/promptfoo/package.json').version!=='0.124.1')
          throw new Error('Pinned evaluator missing or changed');"
      - name: Run offline positive and negative CLI checks
        run: node --test tests/evaluation-bridge.test.mjs tests/evaluation-release-gate.test.mjs
      - name: Retain synthetic evidence summaries
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: offline-engineering-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7
          path: |
            tools/evaluations/output/test-*/manifest.json
            tools/evaluations/output/test-*/gate.json
            tools/evaluations/output/test-*/promptfoo.junit.xml
            tools/evaluations/output/test-*/negative-assertion/gate.json
