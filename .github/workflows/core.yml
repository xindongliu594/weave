name: Core verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  portable:
    name: Portable core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            services/agent-runtime/package-lock.json
      - run: npm ci
      - run: npm ci --prefix services/agent-runtime
      - run: npm run build
      - run: npm run test:rules
      - run: node --test tests/maintenance-report.test.mjs
      - run: node --import tsx --test tests/identity-session.test.ts tests/identity-management-ui.test.ts tests/maintenance-health.test.ts tests/storage-center.test.ts tests/audit-query-api.test.ts tests/audit-history-ui.test.ts tests/tool-effect-review-ui.test.ts
      - run: node scripts/test-integration.mjs tests/identity-management.test.ts tests/resource-authorization.test.ts tests/source-bounds.test.ts tests/api-access.test.ts tests/api-idempotency.test.ts tests/completion-protocol-api.test.ts tests/organization-session.test.ts
      - run: node scripts/test-integration.mjs tests/api-enterprise-boundary.test.ts tests/resource-project-routes.test.ts tests/resource-file-lineage.test.ts tests/resource-knowledge-lineage.test.ts tests/tool-effect-contracts.test.ts tests/tool-effect-sources.test.ts tests/tool-effect-production.test.ts tests/tool-effect-review-api.test.ts tests/tool-operations.test.ts tests/tool-effect-recovery.test.ts tests/tool-effect-approval.test.ts tests/backup-enterprise-protection.test.ts
      - run: node scripts/test-integration.mjs tests/resource-approval-audit.test.ts tests/storage-maintenance-writer.test.ts tests/identity-initialization-barrier.test.ts
      - run: node scripts/test-integration.mjs tests/app-startup-recovery.test.ts tests/backup-restore-state.test.ts tests/backup-writer.test.ts tests/run-current-authority.test.ts
      - run: node --import tsx --test tests/observation-pipeline.test.ts
      - run: node scripts/test-integration.mjs tests/run-terminal-maintenance.test.ts tests/run-admission-writer.test.ts tests/local-operation-writer.test.ts tests/task-canonical-writer.test.ts tests/local-executor-writer.test.ts tests/task-accepted-stop-writer.test.ts
      - run: npm run runtime:inspect
      - run: npm run runtime:test:portable
      - run: npm run test:integration
      - run: npm run demo:check
      - run: npm run local:check
      - run: npm test --prefix apps/desktop
  backend:
    name: PostgreSQL and Docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            services/agent-runtime/package-lock.json
      - run: npm ci
      - run: npm ci --prefix services/agent-runtime
      - name: Start isolated database and install sandbox image
        run: |
          docker compose -p agent-department-ci -f infra/compose.yml up -d --wait
          docker pull node:22.19.0-bookworm-slim
      - run: python3 scripts/install-embedding-model.py
      - name: Native backend suites
        # These suites require per-file PGlite or an explicit owned native fixture.
        # Portable suites run above; never weaken native production-database guards.
        shell: bash
        run: |
          native_tests=()
          for test_file in tests/*.test.ts; do
            case "$test_file" in
              tests/identity-management.test.ts|tests/resource-authorization.test.ts|tests/source-bounds.test.ts|tests/api-idempotency.test.ts|tests/completion-protocol-api.test.ts|tests/organization-session.test.ts|tests/api-enterprise-boundary.test.ts|tests/resource-project-routes.test.ts|tests/resource-file-lineage.test.ts|tests/resource-knowledge-lineage.test.ts|tests/knowledge-department-lock.test.ts|tests/resource-approval-audit.test.ts|tests/storage-maintenance-writer.test.ts|tests/identity-initialization-barrier.test.ts|tests/app-startup-recovery.test.ts|tests/backup-restore-state.test.ts|tests/backup-writer.test.ts|tests/run-current-authority.test.ts|tests/tool-effect-contracts.test.ts|tests/tool-effect-sources.test.ts|tests/tool-effect-production.test.ts|tests/tool-effect-review-api.test.ts|tests/tool-operations.test.ts|tests/tool-effect-recovery.test.ts|tests/tool-effect-approval.test.ts|tests/backup-enterprise-protection.test.ts) continue ;;
            esac
            native_tests+=("$test_file")
          done
          node --import tsx --test "${native_tests[@]}"
      - run: node --test services/agent-runtime/sandbox.test.mjs
      - name: Database diagnostics on failure
        if: failure()
        run: docker compose -p agent-department-ci -f infra/compose.yml logs
      - name: Remove CI database
        if: always()
        run: docker compose -p agent-department-ci -f infra/compose.yml down --volumes
