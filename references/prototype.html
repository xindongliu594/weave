function checkDAG(tasks,agents){

 const visiting=new Set(),done=new Set(),ordered=[];let cycle=false;
 function visit(id){if(visiting.has(id)){cycle=true;return}if(done.has(id))return;visiting.add(id);tasks.find(t=>t.id===id).dependencies.forEach(visit);visiting.delete(id);done.add(id);ordered.push(tasks.find(t=>t.id===id))}
 ids.forEach(visit);return{valid:!cycle,reason:cycle?'检测到循环依赖':'无循环 · 依赖有效',ordered:cycle?tasks:ordered};
}

const artifacts={
 requirements:`# 本地 Todo REST API — 接口说明（模拟交付）\n\nGET /health → 200 {"status":"ok"}\nPOST /todos → 201 创建记录；请求 {"title":"..."}\nGET /todos → 200 返回列表\nGET /todos/{id} → 200 返回记录；不存在时 404\nPATCH /todos/{id} → 200 更新 title 或 completed\nDELETE /todos/{id} → 204 删除记录\n\n验收标准\n- title 为非空字符串，completed 为布尔值。\n- 非法 JSON 或字段返回 400；未知路由返回 404。\n- 数据暂存在内存，进程退出后清空。\n\n来源：engineering-docs / api-conventions.md / v1 / chunk_001\n此文档为原型预置示例，并非真实 Agent 执行结果。`,
 implementation:`# server.py — 预置源码示例，仅用于展示\nfrom http.server import BaseHTTPRequestHandler, HTTPServer\nimport json\n\ntodos = {}\nnext_id = 1\n\nclass API(BaseHTTPRequestHandler):\n    def reply(self, status, data=None):\n        self.send_response(status)\n        self.send_header('Content-Type', 'application/json; charset=utf-8')\n        self.end_headers()\n        if data is not None:\n            self.wfile.write(json.dumps(data).encode())\n\n    def parts(self):\n        return self.path.split('?')[0].strip('/').split('/')\n\n    def body(self):\n        try:\n            data = json.loads(self.rfile.read(int(self.headers.get('Content-Length', '0'))))\n            return data if isinstance(data, dict) else None\n        except (ValueError, TypeError):\n            return None\n\n    def do_GET(self):\n        parts = self.parts()\n        if parts == ['health']:\n            return self.reply(200, {'status': 'ok'})\n        if parts == ['todos']:\n            return self.reply(200, list(todos.values()))\n        if len(parts) == 2 and parts[0] == 'todos' and parts[1] in todos:\n            return self.reply(200, todos[parts[1]])\n        self.reply(404, {'error': 'not_found'})\n\n    def do_POST(self):\n        global next_id\n        if self.parts() != ['todos']:\n            return self.reply(404, {'error': 'not_found'})\n        data = self.body()\n        if not data or not isinstance(data.get('title'), str) or not data['title'].strip():\n            return self.reply(400, {'error': 'invalid_title'})\n        item = {'id': next_id, 'title': data['title'].strip(), 'completed': False}\n        todos[str(next_id)] = item\n        next_id += 1\n        self.reply(201, item)\n\n    def do_PATCH(self):\n        parts = self.parts()\n        if len(parts) != 2 or parts[0] != 'todos' or parts[1] not in todos:\n            return self.reply(404, {'error': 'not_found'})\n        data = self.body()\n        if not data or set(data) - {'title', 'completed'}:\n            return self.reply(400, {'error': 'invalid_fields'})\n        if 'title' in data and (not isinstance(data['title'], str) or not data['title'].strip()):\n            return self.reply(400, {'error': 'invalid_title'})\n        if 'completed' in data and not isinstance(data['completed'], bool):\n            return self.reply(400, {'error': 'invalid_completed'})\n        if 'title' in data:\n            data['title'] = data['title'].strip()\n        todos[parts[1]].update(data)\n        self.reply(200, todos[parts[1]])\n\n    def do_DELETE(self):\n        parts = self.parts()\n        if len(parts) != 2 or parts[0] != 'todos' or parts[1] not in todos:\n            return self.reply(404, {'error': 'not_found'})\n        del todos[parts[1]]\n        self.reply(204)\n\nif __name__ == '__main__':\n    HTTPServer(('127.0.0.1', 8000), API).serve_forever()`,
 verification:`# test_api.py — 预置测试示例；未在此原型中实际执行\nimport json\nimport threading\nimport unittest\nimport urllib.request\nfrom http.server import HTTPServer\nfrom server import API\n\nclass TestTodo(unittest.TestCase):\n    @classmethod\n    def setUpClass(cls):\n        cls.server = HTTPServer(('127.0.0.1', 0), API)\n        cls.base = 'http://127.0.0.1:' + str(cls.server.server_port)\n        cls.thread = threading.Thread(target=cls.server.serve_forever, daemon=True)\n        cls.thread.start()\n\n    @classmethod\n    def tearDownClass(cls):\n        cls.server.shutdown()\n        cls.server.server_close()\n        cls.thread.join()\n\n    def request(self, path, method='GET', data=None):\n        req = urllib.request.Request(self.base + path,\n            data=json.dumps(data).encode() if data is not None else None,\n            headers={'Content-Type': 'application/json'}, method=method)\n        with urllib.request.urlopen(req) as res:\n            raw = res.read()\n            return res.status, json.loads(raw) if raw else None\n\n    def test_health(self):\n        self.assertEqual(self.request('/health'), (200, {'status':'ok'}))\n\n    def test_crud(self):\n        status, item = self.request('/todos', 'POST', {'title':'demo'})\n        self.assertEqual(status, 201)\n        path = '/todos/' + str(item['id'])\n        self.assertEqual(self.request(path)[1]['title'], 'demo')\n        self.assertTrue(self.request(path, 'PATCH', {'completed':True})[1]['completed'])\n        self.assertEqual(self.request(path, 'DELETE')[0], 204)\n\nif __name__ == '__main__':\n    unittest.main()`,
